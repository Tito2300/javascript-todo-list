<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A responsive to-do list built with HTML, CSS, and JavaScript."><title>To-Do List</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="todo-card"><header><p class="eyebrow">STAY ORGANIZED</p><h1>My To-Do List</h1><p class="subtitle">Add tasks, check them off, and keep track of what still needs to be done.</p></header><form id="task-form" class="task-form"><label class="sr-only" for="task-input">New task</label><input id="task-input" type="text" placeholder="What do you need to do?" maxlength="120" autocomplete="off"><button type="submit">Add Task</button></form><div class="toolbar"><p id="task-counter" aria-live="polite">0 tasks remaining</p><button id="clear-completed" class="text-button" type="button">Clear completed</button></div><ul id="task-list" class="task-list" aria-label="Tasks"></ul><div id="empty-state" class="empty-state"><p>No tasks yet.</p><span>Add your first task above.</span></div></section></main><script src="script.js"></script></body></html>
